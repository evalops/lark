<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lark</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="pill" class="collapsed">
      <div id="waveform" aria-hidden="true"></div>
      <div id="response" class="response hidden"></div>
      
      <div id="api-key-setup" class="api-key-setup hidden">
        <div class="api-key-label">Enter your <span id="provider-name">Anthropic</span> API key:</div>
        <div class="api-key-input-row">
          <input id="api-key-input" type="password" placeholder="sk-ant-..." autocomplete="off" />
          <button id="api-key-save" class="save-btn">Save</button>
        </div>
        <div id="api-key-error" class="api-key-error hidden"></div>
      </div>

      <div id="settings-modal" class="settings-modal hidden">
        <div class="settings-header">
          <span>Settings</span>
          <button id="settings-close" class="icon-btn">&times;</button>
        </div>
        
        <div class="settings-section">
          <label>Provider</label>
          <select id="setting-provider">
            <option value="claude">Anthropic (Claude)</option>
            <option value="gemini">Google (Gemini)</option>
          </select>
        </div>

        <div class="settings-section">
          <label>Model</label>
          <select id="setting-model">
            <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
            <option value="claude-opus-4-5-20251101">Claude Opus 4.5</option>
          </select>
        </div>
    
        <div class="settings-section">
          <label>Max Steps</label>
          <input id="setting-max-steps" type="number" min="1" max="100" />
        </div>
    
        <div class="settings-section">
          <label>Delay (ms)</label>
          <input id="setting-delay" type="number" min="0" step="100" />
        </div>

        <div class="settings-section">
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="setting-confirm-dangerous" />
            <label for="setting-confirm-dangerous" style="margin-bottom: 0;">Confirm dangerous actions</label>
          </div>
        </div>
    
        <div class="settings-section">
          <label>API Key</label>
          <input id="setting-api-key" type="password" placeholder="sk-ant-..." />
        </div>
    
        <button id="settings-save" class="full-width-btn">Save Changes</button>
      </div>

      <div id="confirmation-modal" class="settings-modal hidden">
        <div class="settings-header">
          <span>Confirm Action</span>
        </div>
        <div class="settings-section">
          <p id="confirmation-text" style="margin: 10px 0; color: #ccc; font-size: 14px; line-height: 1.4;">Allow this action?</p>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button id="confirm-deny" class="full-width-btn" style="background: #3a3a3c;">Deny</button>
          <button id="confirm-allow" class="full-width-btn" style="background: #0A84FF;">Allow</button>
        </div>
      </div>

      <div id="main-input" class="input-row">
        <button id="settings-toggle" class="icon-btn settings-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
        <div id="loader" class="loader hidden"></div>
        <input id="prompt" type="text" placeholder="Ask me to control your computer..." />
        <button id="send" class="send-btn">&#8593;</button>
      </div>
    </div>
    <script type="module" src="../dist/renderer/renderer.js"></script>
  </body>
</html>
